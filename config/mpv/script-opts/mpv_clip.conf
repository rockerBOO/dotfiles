# Enable hardware acceleration
use_encoding=yes
use_hwaccel=yes
hwaccel_api=auto

# Or specify explicitly:
# hwaccel_api=nvenc
# nvenc_codec=hevc_nvenc
# hwaccel_device=0  # For multi-GPU systems

# Output settings
output_directory=~/Videos/clips
container_format=mp4
video_crf=23

# Space saving
# use_encoding=yes
# use_hwaccel=yes
